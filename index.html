<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHYS 111 – Flashcards</title>
<style>
:root{--bg:#eef2f7;--fr:#fff;--bk:#2d4a8a;--tx:#1f2937;--sub:#6b7280;--ac:#2d4a8a;--ok:#15803d;--no:#dc2626;--bd:#d6dce5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--fr:#1f2937;--bk:#3b5bb5;--tx:#f3f4f6;--sub:#9ca3af;--ac:#8fb0ff;--ok:#4ade80;--no:#f87171;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,button{font:inherit;border:1px solid var(--bd);background:var(--fr);color:var(--tx);border-radius:10px;padding:9px 12px;cursor:pointer}
select{flex:1;min-width:0}
button:active{transform:scale(.97)}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:6px}
.track{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:var(--ac);width:0;transition:width .3s}
.scene{perspective:1200px;height:340px;cursor:pointer}
.card{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.14);overflow:auto}
.front{background:var(--fr);border:2px solid var(--ac)}
.back{background:var(--bk);color:#fff;transform:rotateY(180deg)}
.tag{position:absolute;top:12px;left:16px;font-size:12px;opacity:.7}
.big{font-size:26px;font-weight:700;line-height:1.25}
.txt{font-size:17px;line-height:1.55}
.hint{position:absolute;bottom:10px;font-size:12px;opacity:.6}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.nav .k{background:var(--ok);color:#fff;border:0}.nav .r{background:var(--no);color:#fff;border:0}
.nav button{padding:13px;font-weight:600}
.pn{display:flex;gap:10px;margin-top:10px}.pn button{flex:1}
.done{background:var(--fr);border:2px solid var(--ac);border-radius:18px;padding:28px 20px;text-align:center;box-shadow:0 6px 22px rgba(0,0,0,.14)}
.done .big{margin-bottom:8px}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>PHYS 111 – General Physics 1 · Flashcards</h1>
<div class="tools">
<select id="part"></select>
<button id="mode">Term → Definition</button>
<button id="shuf">Shuffle</button>
</div>
<div class="stats"><span id="pos"></span><span id="st"></span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div id="main"></div>
<div id="ctl">
<div class="nav"><button class="r" id="miss">✗ Review again</button><button class="k" id="know">✓ I know it</button></div>
<div class="pn"><button id="prev">← Prev</button><button id="next">Next →</button></div>
</div>
</div>
<script>
const raw=`Physics|The branch of science that studies matter, energy, motion, forces, and the fundamental interactions that govern the natural world.
Mechanics|The branch of physics that deals with the motion of objects and the forces acting on them.
Matter|Anything that has mass and occupies space.
Energy|The capacity of a system or object to do work or produce changes.
Scientific Method|A systematic process used to investigate phenomena through observation, hypothesis formation, experimentation, and analysis.
Hypothesis|A proposed explanation or prediction that can be tested through experiments or observations.
Physical Quantity|A measurable property of an object or phenomenon that can be expressed using a numerical value and a unit.
Measurement|The process of determining the magnitude of a physical quantity by comparing it with an accepted standard.
International System of Units (SI)|The internationally recognized system of measurement that establishes standard units for physical quantities.
Meter (m)|The SI base unit used to measure length or distance.
Kilogram (kg)|The SI base unit used to measure mass.
Second (s)|The SI base unit used to measure time.
Kelvin (K)|The SI base unit used to measure thermodynamic temperature.
Derived Unit|A unit obtained by combining SI base units through multiplication or division, such as meters per second or newtons.
Dimensional Analysis|A method of examining physical equations by comparing the dimensions of their quantities to verify consistency.
Scientific Notation|A way of expressing very large or very small numbers as a number between 1 and 10 multiplied by a power of 10.
Significant Figures|The meaningful digits in a measured value that indicate its precision, including all certain digits and one estimated digit.
Unit Conversion|The process of expressing a physical quantity in a different unit without changing its actual magnitude.
Accuracy|The degree to which a measured value is close to the accepted or true value.
Precision|The degree of agreement or consistency among repeated measurements of the same quantity.
Measurement Uncertainty|The estimated range within which the true value of a measured quantity is expected to lie.
Systematic Error|A consistent measurement error that causes results to differ from the true value in a predictable direction.
Random Error|An unpredictable variation in measurements caused by uncontrollable factors or limitations in the measurement process.
Absolute Error|The magnitude of the difference between a measured value and the accepted value.
Relative Error|The ratio of the absolute error to the accepted value, indicating the size of the error relative to the actual quantity.
Percent Error|The relative error expressed as a percentage by multiplying it by 100.
Scalar Quantity|A physical quantity described by magnitude only, without direction.
Vector Quantity|A physical quantity that requires both magnitude and direction for complete description.
Magnitude|The numerical size or amount of a physical quantity, regardless of its direction.
Direction|The orientation or position toward which a vector quantity acts or points.
Displacement|The change in position of an object from its initial point to its final point, including direction.
Distance|The total length of the actual path traveled by an object, regardless of direction.
Resultant Vector|A single vector that represents the combined effect of two or more vectors.
Vector Addition|The mathematical process of combining two or more vectors to determine their resultant.
Vector Components|The perpendicular parts of a vector, commonly resolved into horizontal and vertical components.
Unit Vector|A vector with a magnitude of exactly one that indicates a particular direction.
Kinematics|The branch of mechanics that describes the motion of objects without considering the forces responsible for that motion.
Position|The location of an object relative to a chosen reference point or coordinate system.
Motion|A change in the position of an object over time relative to a reference point.
Speed|The rate at which an object covers distance, expressed as distance traveled per unit time.
Velocity|The rate of change of an object’s displacement with respect to time, including direction.
Acceleration|The rate of change of velocity with respect to time.
Average Speed|The total distance traveled divided by the total time taken.
Average Velocity|The total displacement divided by the total elapsed time.
Instantaneous Velocity|The velocity of an object at a specific moment in time.
Uniform Motion|Motion in which an object maintains a constant velocity over time.
Uniformly Accelerated Motion|Motion in which an object’s acceleration remains constant throughout its movement.
Free Fall|The motion of an object when gravity is the only force acting on it, neglecting air resistance.
Projectile Motion|The two-dimensional motion of an object launched into the air and influenced only by gravity, neglecting air resistance.
Trajectory|The curved or straight path followed by a moving object as it travels through space.
Force|A push or pull that can change an object’s motion, direction, or shape.
Newton’s First Law of Motion|The law stating that an object remains at rest or continues moving with constant velocity unless acted upon by a net external force.
Inertia|The tendency of an object to resist changes in its state of rest or uniform motion.
Newton’s Second Law of Motion|The law stating that the net force acting on an object is equal to its mass multiplied by its acceleration.
Newton’s Third Law of Motion|The law stating that for every action force, there is an equal and opposite reaction force.
Net Force|The vector sum of all external forces acting on an object.
Mass|A measure of the amount of matter in an object and its resistance to changes in motion.
Weight|The gravitational force exerted on an object by a celestial body, such as Earth.
Normal Force|The support force exerted by a surface on an object in contact with it, acting perpendicular to the surface.
Friction|A force that opposes relative motion or the tendency of motion between surfaces in contact.
Tension|The pulling force transmitted through a stretched rope, cable, or string.
Free-Body Diagram (FBD)|A simplified drawing that represents an object as a point or body and shows all external forces acting on it using arrows.
Work|The transfer of energy that occurs when a force causes an object to undergo displacement.
Joule (J)|The SI unit of work and energy, equivalent to one newton-meter.
Kinetic Energy|The energy possessed by an object due to its motion.
Potential Energy|The energy stored in an object or system because of its position, configuration, or condition.
Gravitational Potential Energy|The energy an object possesses because of its position within a gravitational field.
Elastic Potential Energy|The energy stored in an elastic object when it is stretched or compressed.
Mechanical Energy|The total energy of a system associated with its motion and position, commonly the sum of kinetic and potential energy.
Law of Conservation of Energy|The principle stating that energy cannot be created or destroyed but can only be transferred or transformed from one form to another.
Power|The rate at which work is done or energy is transferred per unit time.
Efficiency|The ratio of useful output energy or work to the total input energy or work, usually expressed as a percentage.
Linear Momentum|The product of an object’s mass and velocity, representing the quantity of motion it possesses.
Impulse|The product of the net force acting on an object and the time interval during which the force acts, resulting in a change in momentum.
Impulse-Momentum Theorem|The principle stating that the impulse exerted on an object is equal to its change in momentum.
Conservation of Momentum|The principle stating that the total momentum of an isolated system remains constant when no net external force acts on it.
Collision|An interaction between two or more objects in which they exert forces on one another over a relatively short time interval.
Elastic Collision|A collision in which both total momentum and total kinetic energy are conserved.
Inelastic Collision|A collision in which total momentum is conserved but total kinetic energy is not conserved.
Perfectly Inelastic Collision|A collision in which two or more objects stick together and move as one object after impact.
Explosion|An event in which an object or system separates into two or more parts due to internal forces, with total momentum conserved when external forces are negligible.
Circular Motion|The motion of an object along a circular path around a fixed center or axis.
Centripetal Acceleration|The acceleration of an object moving in a circular path, directed toward the center of the circle.
Centripetal Force|The net inward force required to keep an object moving along a circular path.
Angular Velocity|The rate of change of angular displacement with respect to time, commonly measured in radians per second.
Period|The time required for an object to complete one full revolution or cycle of motion.
Frequency|The number of complete cycles or revolutions performed per unit time.
Universal Law of Gravitation|Newton’s law stating that every two objects with mass attract each other through a gravitational force proportional to the product of their masses and inversely proportional to the square of the distance between their centers.
Gravitational Field|The region around a massive object where another object experiences a gravitational force.
Orbital Motion|The motion of an object around another object due to the gravitational attraction between them.
Angular Displacement|The angle through which an object rotates about a fixed axis, commonly measured in radians.
Angular Acceleration|The rate of change of angular velocity with respect to time.
Moment of Inertia|A measure of an object’s resistance to changes in its rotational motion, depending on its mass distribution relative to the axis of rotation.
Torque|The rotational effect of a force that causes or tends to cause an object to rotate about an axis or pivot point.
Lever Arm|The perpendicular distance from the axis of rotation or pivot point to the line of action of an applied force.
Angular Momentum|The rotational equivalent of linear momentum, representing the quantity of rotational motion of an object or system.
Static Equilibrium|The condition in which an object remains at rest because the net external force and net external torque acting on it are both zero.
Center of Gravity|The point at which the entire weight of an object can be considered to act.
Stress|The internal force acting per unit cross-sectional area within a material when it is subjected to an external load.
Strain|The measure of deformation of a material, expressed as the ratio of the change in dimension to its original dimension.`.split("\n").map(l=>l.split("|"));
const P=["Introduction to Physics","Measurement and Units","Measurement Uncertainty and Errors","Scalars and Vectors","Kinematics: One-Dimensional and Two-Dimensional Motion","Newton’s Laws of Motion","Work, Energy, and Power","Momentum and Impulse","Circular Motion and Gravitation","Rotational Motion, Torque, Equilibrium, and Elasticity"];
const B=[7,18,26,36,50,62,72,81,90,100],part=i=>B.findIndex(b=>i<b);
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let deck=[],pos=0,flip=false,rev=false,fin=false,stat={};
$("part").innerHTML='<option value="all">All parts (1–100)</option>'+P.map((p,i)=>`<option value="${i}">Part ${["I","II","III","IV","V","VI","VII","VIII","IX","X"][i]} – ${p}</option>`).join("");
function load(ix){deck=ix;pos=0;flip=false;fin=false;draw()}
function base(){const v=$("part").value;return raw.map((_,i)=>i).filter(i=>v==="all"||part(i)==+v)}
function draw(){
 const k=deck.filter(i=>stat[i]==="k").length,r=deck.filter(i=>stat[i]==="r").length;
 $("st").textContent=`✓ ${k}  ✗ ${r}`;
 $("fill").style.width=(deck.length?(k+r)/deck.length*100:0)+"%";
 if(fin){
  $("pos").textContent="Deck finished";$("ctl").classList.add("hide");
  $("main").innerHTML=`<div class="done"><div class="big">Deck finished</div><div class="txt">Known: ${k} · To review: ${r} · Total: ${deck.length}</div><div class="row">${r?'<button id="rm">Review missed cards</button>':""}<button id="rs">Restart deck</button></div></div>`;
  if(r)$("rm").onclick=()=>{const m=deck.filter(i=>stat[i]==="r");m.forEach(i=>delete stat[i]);load(sh(m))};
  $("rs").onclick=()=>{deck.forEach(i=>delete stat[i]);load(deck)};
  return}
 $("ctl").classList.remove("hide");
 const i=deck[pos];$("pos").textContent=`Card ${pos+1} of ${deck.length}`;
 const f=rev?raw[i][1]:raw[i][0],b=rev?raw[i][0]:raw[i][1];
 const fc=rev?"txt":"big",bc=rev?"big":"txt";
 $("main").innerHTML=`<div class="scene" id="sc"><div class="card ${flip?"flip":""}" id="cd"><div class="face front"><span class="tag">#${i+1} · Part ${["I","II","III","IV","V","VI","VII","VIII","IX","X"][part(i)]}</span><div class="${fc}">${f}</div><span class="hint">Tap to flip</span></div><div class="face back"><span class="tag">#${i+1}</span><div class="${bc}">${b}</div></div></div></div>`;
 $("sc").onclick=()=>{flip=!flip;$("cd").classList.toggle("flip",flip)};
}
function go(d){if(fin)return;flip=false;const n=pos+d;if(n<0)return;if(n>=deck.length){fin=true}else pos=n;draw()}
function mark(s){if(fin)return;stat[deck[pos]]=s;go(1)}
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("know").onclick=()=>mark("k");$("miss").onclick=()=>mark("r");
$("shuf").onclick=()=>{stat={};load(sh(base()))};
$("part").onchange=()=>{stat={};load(base())};
$("mode").onclick=()=>{rev=!rev;$("mode").textContent=rev?"Definition → Term":"Term → Definition";flip=false;draw()};
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);
 else if((e.key===" "||e.key==="Enter")&&!fin&&document.activeElement.tagName!=="BUTTON"&&document.activeElement.tagName!=="SELECT"){e.preventDefault();flip=!flip;$("cd").classList.toggle("flip",flip)}
});
load(base());
</script>
</body>
</html>
